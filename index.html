// ==================== CHART MANAGER ====================
const ChartManager = {
    instances: {},

    create(id, type, data, options) {
        this.destroy(id);
        const ctx = document.getElementById(id);
        if (!ctx) return null;
        this.instances[id] = new Chart(ctx, {
            type: type,
            data: data,
            options: Object.assign({ responsive: true, maintainAspectRatio: false }, options || {})
        });
        return this.instances[id];
    },

    destroy(id) {
        if (this.instances[id]) {
            this.instances[id].destroy();
            delete this.instances[id];
        }
    },

    destroyAll() {
        Object.keys(this.instances).forEach(id => this.destroy(id));
    }
};

    authRequired: ['cart'],
    ownerRequired: ['dashboard', 'myStore', 'orders', 'payments', 'analytics', 'settings'],

    navigate(page) {
        // Verificar si la página requiere autenticación de comprador
        if (this.authRequired.includes(page) && !Store.currentUser) {
            App.showAuthModal('buyer');
            return;
        }

        // Verificar si la página requiere autenticación de dueño
        if (this.ownerRequired.includes(page) && !OwnerAuth.isAuthenticated) {
            App.showOwnerAuthModal();
            return;
        }

        this.currentPage = page;
        window.scrollTo(0, 0);
        App.render();
    }
};

                <i class="fas fa-lock mr-2"></i>Acceder como Dueño
            </button>
        </div>`;
    }

    const sellerOrders = Store.orders;
    const paymentFilter = App.currentPaymentFilter || 'todos';
    const statusFilter = App.currentPaymentStatusFilter || 'todos';

    const filteredPayments = sellerOrders.filter(order => {
        if (paymentFilter !== 'todos' && order.paymentMethod) {
            if (order.paymentMethod.type !== paymentFilter) return false;
        }
        if (statusFilter !== 'todos') {
            if ((order.paymentStatus || 'pendiente') !== statusFilter) return false;
        }
        return true;
    });

    const totalRevenue = filteredPayments.reduce((a, o) => a + o.total, 0);
    const confirmedRevenue = filteredPayments.filter(o => o.paymentStatus === 'confirmado').reduce((a, o) => a + o.total, 0);
    const pendingRevenue = filteredPayments.filter(o => !o.paymentStatus || o.paymentStatus === 'pendiente').reduce((a, o) => a + o.total, 0);

    const getPaymentStatusBadge = (status) => {
        if (status === 'confirmado') return '<span class="status-badge bg-emerald-900 text-emerald-300"><i class="fas fa-check-circle mr-1"></i>Confirmado</span>';
        if (status === 'rechazado') return '<span class="status-badge bg-cyan-900 text-red-300"><i class="fas fa-times-circle mr-1"></i>Rechazado</span>';
        return '<span class="status-badge bg-amber-900 text-amber-300"><i class="fas fa-clock mr-1"></i>Pendiente</span>';
    };

    return `
    <div class="animate-fade-in">
        <div class="flex min-h-screen">
            ${Sidebar('payments')}

            <main class="flex-1 p-4 sm:p-6 lg:p-8 main-content">

                        <select onchange="App.filterPaymentMethod(this.value)" class="bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-cyan-500 outline-none">
                            <option value="todos">Todos los métodos</option>
                            <option value="transfer">Transferencia</option>
                            <option value="cash">Efectivo</option>
                        </select>
                        <select onchange="App.filterPaymentStatus(this.value)" class="bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-cyan-500 outline-none">
                            <option value="todos">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="rechazado">Rechazado</option>
                        </select>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 lg:gap-6 mb-8 stats-grid">
                    <div class="bg-gray-900 rounded-xl p-6 shadow-md card-hover">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 bg-cyan-900/30 rounded-lg flex items-center justify-center text-orange-500 text-xl">
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                            <span class="text-gray-400 text-sm font-medium">${filteredPayments.length} pagos</span>

const App = {
    currentFilter: 'Todos',
    searchQuery: '',
    authModal: '',
    productModal: '',
    userMenu: '',

    init() {
        this.render();
    },

    render() {
        const app = document.getElementById('app');
        app.innerHTML = `
            ${Header()}
            <main class="min-h-screen">
                ${Router.currentPage === 'home' ? HomePage() : 
                  Router.currentPage === 'product' ? ProductDetailPage(App.currentProductId) :
                  Router.currentPage === 'cart' ? CartPage() :
                  Router.currentPage === 'dashboard' ? DashboardPage() :
                  Router.currentPage === 'myStore' ? MyStorePage() :
                  Router.currentPage === 'orders' ? OrdersPage() :
                  Router.currentPage === 'payments' ? PaymentsPage() :
                  Router.currentPage === 'analytics' ? AnalyticsPage() :
                  Router.currentPage === 'settings' ? SettingsPage() :
                  HomePage()}
            </main>
            ${Router.currentPage === 'home' || Router.currentPage === 'cart' || Router.currentPage === 'product' ? Footer() : ''}
            ${this.authModal}
            ${this.productModal}
            ${this.userMenu}
        `;
    },

    handleSearch(query) {
        this.searchQuery = query;
        if (Router.currentPage !== 'home') {
            Router.currentPage = 'home';
        }
        this.render();
    },

    handleCategorySearch(category) {
        this.filterCategory(category);
    },

    clearSearch() {
        this.searchQuery = '';
        this.currentFilter = 'Todos';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        this.render();
    },

    filterCategory(cat) {
        this.currentFilter = cat;
        this.searchQuery = '';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        const searchCategory = document.getElementById('searchCategory');
        if (searchCategory) searchCategory.value = cat;
        Router.navigate('home');
    },

    showProductDetail(productId) {
        this.currentProductId = productId;
        Router.navigate('product');
    },

    addToCart(productId) {
        // Verificar autenticación obligatoria
        if (!Store.currentUser) {
            this.showToast('🔒 Inicia sesión para agregar productos al carrito');
            this.showAuthModal('buyer');
            return;
        }

        const product = Store.products.find(p => p.id === productId);
        if (!Store.isProductAvailable(product)) {
            this.showToast(product && product.status === 'pausado' ? 'Este producto está pausado' : 'Producto no disponible');
            return;
        }

        const existing = Store.cart.find(i => i.id === productId);

        if (existing) {
            if (existing.qty < product.stock) {
                existing.qty++;
            } else {
                this.showToast('No hay más stock disponible');
                return;
            }
        } else {
            Store.cart.push({ ...product, qty: 1 });
        }

        Store.saveCart();
        this.showToast(product.name + ' agregado al carrito');
        this.render();
    },

    buyNow(productId) {
        if (!Store.currentUser) {
            this.showToast('🔒 Inicia sesión para comprar');
            this.showAuthModal('buyer');
            return;
        }
        this.addToCart(productId);
        Router.navigate('cart');
    },

    updateQty(productId, delta) {
        const item = Store.cart.find(i => i.id === productId);
        const product = Store.products.find(p => p.id === productId);
        if (!item || !product) return;

        if (delta > 0 && item.qty >= product.stock) {
            this.showToast('No hay más stock disponible');
            return;
        }

        item.qty += delta;
        if (item.qty <= 0) {
            Store.cart = Store.cart.filter(i => i.id !== productId);
        }
        Store.saveCart();
        this.render();
    },

    removeFromCart(productId) {
        Store.cart = Store.cart.filter(i => i.id !== productId);
        Store.saveCart();
        this.render();
    },

    checkout() {
        if (Store.cart.length === 0) return;

        if (!Store.currentUser) {
            this.showToast('🔒 Inicia sesión para comprar');
            this.showAuthModal('buyer');
            return;
        }

        if (!Store.deliveryAddress) {
            this.showToast('⚠️ Agrega una dirección de entrega primero');
            this.showAddressModal();
            return;
        }

        if (!Store.paymentMethod) {
            this.showToast('⚠️ Selecciona un método de pago primero');
            this.showPaymentModal();
            return;
        }

        const invalidItem = Store.cart.find(cartItem => {
            const product = Store.products.find(p => p.id === cartItem.id);
            return !Store.isProductAvailable(product) || cartItem.qty > product.stock;
        });

        if (invalidItem) {
            this.showToast('Revisa el stock antes de pagar: ' + invalidItem.name);
            this.render();
            return;
        }

        const total = Store.cart.reduce((a, i) => a + (i.price * i.qty), 0);
        const shipping = total > 50 ? 0 : 5.99;
        const tax = total * 0.16;
        const grandTotal = total + shipping + tax;
        const orderId = 'ORD-' + String(Store.orders.length + 1).padStart(3, '0');

        Store.orders.unshift({
            id: orderId,
            date: new Date().toISOString().split('T')[0],
            subtotal: total,
            shipping: shipping,
            tax: tax,
            total: grandTotal,
            status: 'Procesando',
            items: Store.cart.reduce((a, i) => a + i.qty, 0),
            customer: Store.currentUser ? Store.currentUser.name : 'Invitado',
            itemsList: JSON.parse(JSON.stringify(Store.cart)),
            deliveryAddress: JSON.parse(JSON.stringify(Store.deliveryAddress)),
            paymentMethod: JSON.parse(JSON.stringify(Store.paymentMethod)),
            paymentStatus: 'pendiente'
        });

        Store.cart.forEach(cartItem => {
            const product = Store.products.find(p => p.id === cartItem.id);
            if (product) {
                product.sales += cartItem.qty;
                product.stock -= cartItem.qty;
                if (product.stock === 0) product.status = 'agotado';
            }
        });

        Store.cart = [];
        Store.saveAll();

        this.showToast('¡Pedido ' + orderId + ' realizado con éxito!');
        Router.navigate('home');
    },

    showAuthModal(type) {
        this.authModal = `

    handleNewsletterSubmit(e) {
        e.preventDefault();
        const form = e.target;
        const email = form.newsletterEmail.value;

        // Get existing subscribers
        let subscribers = JSON.parse(localStorage.getItem('newsletter_subscribers') || '[]');

        if (subscribers.includes(email)) {
            this.showToast('⚠️ Este email ya está suscrito');
            return;
        }

        subscribers.push(email);
        localStorage.setItem('newsletter_subscribers', JSON.stringify(subscribers));

        form.reset();
        this.showToast('✅ ¡Suscripción exitosa! Revisa tu email');

    addChatMessage(text, sender) {
        const messagesContainer = document.getElementById('chatMessages');
        if (!messagesContainer) return;

        const time = new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'});

        if (sender === 'user') {
            messagesContainer.innerHTML += `
                <div class="flex gap-2 justify-end">
                    <div class="bg-cyan-600 rounded-lg rounded-tr-none p-2 sm:p-3 max-w-[80%]">

                        <i class="fas fa-user text-white text-xs"></i>

        } else {
            messagesContainer.innerHTML += `

                    <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-cyan-600 flex items-center justify-center flex-shrink-0">

                        <span class="text-gray-500 text-[10px] mt-1 block">${time}</span>
                    </div>
                </div>
            `;
        }

        messagesContainer.scrollTop = messages.scrollHeight;

        // Update badge if chat is closed
        const chatWindow = document.getElementById('chatWindow');

            const badge = document.getElementById('chatBadge');
            if (badge) {

        }

    handleProductSave(e, productId) {
        e.preventDefault();
        const form = e.target;
        const stock = parseInt(form.stock.value);
        const data = {
            name: form.name.value,
            price: parseFloat(form.price.value),
            originalPrice: parseFloat(form.originalPrice.value) || parseFloat(form.price.value),
            stock: stock,
            category: form.category.value,
            description: form.description.value,
            image: form.image.value || '📦',
            seller: 'Caribeum',
            status: stock > 0 ? 'activo' : 'agotado',
            rating: 0,
            reviews: 0,
            sales: 0
        };

        if (productId) {
            const idx = Store.products.findIndex(p => p.id === productId);
            if (idx !== -1) {
                Store.products[idx] = Object.assign({}, Store.products[idx], data);
                this.showToast('Producto actualizado');
            }
        } else {
            const newId = Math.max.apply(null, Store.products.map(p => p.id).concat([0])) + 1;
            Store.products.push(Object.assign({ id: newId }, data));
            this.showToast('Producto creado exitosamente');
        }

        Store.saveProducts();
        this.closeProductModal();
        this.render();
    },

    editProduct(id) {
        this.showProductModal(id);
    },

    toggleProductStatus(id) {
        const product = Store.products.find(p => p.id === id);
        if (!product) return;

        if (product.status === 'activo') {
            product.status = 'pausado';
        } else if (product.status === 'pausado') {
            product.status = product.stock > 0 ? 'activo' : 'agotado';
        } else if (product.status === 'agotado' && product.stock > 0) {
            product.status = 'activo';
        }

        Store.saveProducts();
        this.showToast('Estado actualizado: ' + product.status);
        this.render();
    },

            this.render();

    },

    togglePaymentFields(type) {
        const transferFields = document.getElementById('transferFields');
        const cashFields = document.getElementById('cashFields');

        if (transferFields) transferFields.classList.add('hidden');
        if (cashFields) cashFields.classList.add('hidden');

        if (type === 'transfer' && transferFields) transferFields.classList.remove('hidden');
        if (type === 'cash' && cashFields) cashFields.classList.remove('hidden');

        // Actualizar iconos
        document.querySelectorAll('input[name="type"]').forEach(radio => {
            const icon = radio.parentElement.querySelector('i');
            if (radio.checked) {
                icon.classList.remove('text-gray-500');
                icon.classList.add('text-orange-400');
            } else {
                icon.classList.remove('text-orange-400');
                icon.classList.add('text-gray-500');
            }
        });
    },

    handlePaymentSave(e) {
        e.preventDefault();
        const form = e.target;
        const type = form.type.value;

        let data = { type: type };

        if (type === 'transfer') {
            data.transferRef = form.transferRef.value;
        } else if (type === 'cash') {
            data.cashAmount = parseFloat(form.cashAmount.value) || 0;
        }

        Store.paymentMethod = data;
        Store.savePaymentMethod();
        this.closeProductModal();
        this.showToast('💳 Método de pago guardado correctamente');
        this.render();
    },

    getPaymentIcon(type) {
        switch(type) {
            case 'card': return 'fa-credit-card';

            case 'cash': return 'fa-money-bill-wave';
            default: return 'fa-credit-card';
        }
    },

        switch(type) {

    setReviewStar(star) {
        document.querySelectorAll('.star-btn').forEach(btn => {
            const btnStar = parseInt(btn.dataset.star);
            const icon = btn.querySelector('i');
            if (btnStar <= star) {
                icon.classList.remove('far');
                icon.classList.add('fas', 'text-orange-400');
            } else {
                icon.classList.remove('fas', 'text-orange-400');
                icon.classList.add('far');
            }
        });
        const input = document.getElementById('reviewRating');
        if (input) input.value = star;
    },

    handleReviewSubmit(e, productId) {
        e.preventDefault();
        if (!Store.currentUser) {
            this.showToast('🔒 Inicia sesión para reseñar');
            return;
        }

        const form = e.target;
        const rating = parseInt(form.rating.value) || 5;
        const comment = form.comment.value;

        // Verificar que compró el producto
        const hasBought = Store.orders.some(o => 
            o.customer === Store.currentUser.name && 
            o.itemsList && o.itemsList.some(item => item.id === productId)
        );

        if (!hasBought) {
            this.showToast('⚠️ Solo puedes reseñar productos que hayas comprado');
            return;
        }

        const success = Store.addReview(
            productId,
            Store.currentUser.name,
            Store.currentUser.email,
            rating,
            comment,
            true // verified purchase
        );

        if (success) {
            this.showToast('⭐ ¡Reseña publicada! Gracias por tu opinión');
            this.render();
        } else {
            this.showToast('⚠️ Ya has reseñado este producto');
        }
    },

                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-1 text-white">Número de guía / Tracking</label>
                                <input type="text" name="trackingNumber" value="${order.trackingNumber || ''}" 
                                    class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                                    placeholder="Ej: TRK123456789">
                                <p class="text-gray-500 text-xs mt-1">Opcional. El cliente podrá ver este número.</p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-1 text-white">Notas para el cliente</label>
                                <textarea name="trackingNotes" rows="2" 
                                    class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none"
                                    placeholder="Ej: El paquete saldrá mañana por FedEx...">${order.trackingNotes || ''}</textarea>
                            </div>

                            <div class="flex items-center gap-2 p-3 bg-cyan-900/20 rounded-lg border border-cyan-800">
                                <i class="fas fa-info-circle text-cyan-400"></i>
                                <span class="text-sm text-gray-300">El cliente recibirá una notificación cuando actualices el estado.</span>
                            </div>
                        </div>

                        <div class="flex gap-3 mt-6">
                            <button type="button" onclick="App.closeProductModal()" class="flex-1 border border-cyan-800 hover:bg-cyan-900/30 py-2 rounded-lg transition text-white">
                                Cancelar
                            </button>
                            <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white py-2 rounded-lg font-medium transition">
                                <i class="fas fa-save mr-2"></i>Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        `;
        this.render();
    },

    handleTrackingUpdate(e, orderId) {
        e.preventDefault();
        const form = e.target;
        const newStatus = form.status.value;
        const trackingNumber = form.trackingNumber.value;
        const trackingNotes = form.trackingNotes.value;

        const order = Store.orders.find(o => o.id === orderId);
        if (!order) return;

        const oldStatus = order.status;
        order.status = newStatus;
        order.trackingNumber = trackingNumber;
        order.trackingNotes = trackingNotes;

        if (newStatus === 'Entregado' && !order.deliveredDate) {
            order.deliveredDate = new Date().toISOString().split('T')[0];
        }

        Store.saveOrders();

        if (oldStatus !== newStatus) {
            this.showToast('📦 Estado actualizado: ' + oldStatus + ' → ' + newStatus);
        } else {
            this.showToast('📦 Información de envío actualizada');
        }

        this.closeProductModal();
        this.render();
    },

    getTrackingStep(status) {
        const steps = {
            'Procesando': 1,
            'Preparando': 2,
            'Enviado': 3,
            'En camino': 4,
            'Entregado': 5
        };
        return steps[status] || 1;
    },

    resetAllData() {
        if (confirm('¿ESTÁS SEGURO? Esto borrará TODOS los datos incluyendo productos, pedidos, carrito y usuario. Esta acción no se puede deshacer.')) {
            localStorage.removeItem('products');
            localStorage.removeItem('cart');
            localStorage.removeItem('orders');
            localStorage.removeItem('currentUser');
            Store.clearCache();
            Store.currentUser = null;
            Store.cart = [];
            Store._products = null;
            Store._orders = null;
            this.showToast('Todos los datos han sido restablecidos');
            Router.navigate('home');
        }
    },

    exportProductsExcel() {

        if (products.length === 0) {
            this.showToast('No hay productos para exportar');

        }

        const headers = ['ID', 'Nombre', 'Categoría', 'Precio', 'Precio Original', 'Stock', 'Ventas', 'Estado', 'Vendedor'];
        const rows = products.map(p => [
            p.id, p.name, p.category, p.price, p.originalPrice, p.stock, p.sales, p.status, p.seller
        ]);

        let csv = headers.join(',') + '\n';
        rows.forEach(row => {
            csv += row.map(field => `"${field}"`).join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `caribeum-productos-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('📊 Productos exportados a CSV');
    },

    exportSalesReport() {
        const orders = Store.orders;
        if (orders.length === 0) {
            this.showToast('No hay ventas para reportar');
            return;
        }

        const headers = ['Fecha', 'ID Pedido', 'Cliente', 'Subtotal', 'Envío', 'Impuestos', 'Total', 'Estado', 'Método de Pago'];
        const rows = orders.map(o => [
            o.date, o.id, o.customer, o.subtotal || o.total, o.shipping || 0, o.tax || 0, o.total, o.status, 
            o.paymentMethod ? o.paymentMethod.type : 'N/A'
        ]);

        let csv = headers.join(',') + '\n';
        rows.forEach(row => {
            csv += row.map(field => `"${field}"`).join(',') + '\n';
        });

        // Add summary
        const totalRevenue = orders.reduce((a, o) => a + o.total, 0);
        const totalOrders = orders.length;
        const avgOrder = totalRevenue / totalOrders;

        csv += '\n"RESUMEN"\n';
        csv += `"Total Ingresos","$${totalRevenue.toFixed(2)}"\n`;
        csv += `"Total Pedidos","${totalOrders}"\n`;
        csv += `"Promedio por Pedido","$${avgOrder.toFixed(2)}"\n`;
        csv += `"Fecha de Reporte","${new Date().toLocaleDateString('es-ES')}"\n`;

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `caribeum-ventas-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('📈 Reporte de ventas exportado');

        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
};



// ==================== GEOLOCATION ====================
const GeoLocation = {
    position: null,
    city: null,
    country: null,

    init() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    this.position = position.coords;
                    this.getCityFromCoords(position.coords.latitude, position.coords.longitude);
                    this.showLocationToast();
                },
                (error) => {
                    console.warn("Error obteniendo ubicación:", error.message);
                    this.showLocationError(error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            console.warn("Geolocalización no soportada en este navegador");
        }
    },

    async getCityFromCoords(lat, lon) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
            const data = await response.json();
            if (data.address) {
                this.city = data.address.city || data.address.town || data.address.village || data.address.county || 'Ciudad desconocida';
                this.country = data.address.country || 'País desconocido';
            }
        } catch (e) {
            console.warn("No se pudo obtener la ciudad:", e);
        }
    },

    showLocationToast() {
        const locationText = this.city && this.country 
            ? `📍 Ubicación detectada: ${this.city}, ${this.country}`
            : `📍 Ubicación detectada: ${this.position.latitude.toFixed(4)}, ${this.position.longitude.toFixed(4)}`;

        const toast = document.createElement('div');
        toast.className = 'fixed top-20 right-4 bg-cyan-900 text-white px-6 py-3 rounded-lg shadow-2xl z-50 toast flex items-center gap-2';
        toast.innerHTML = `<i class="fas fa-map-marker-alt text-orange-400"></i> ${locationText}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    },

    showLocationError(error) {
        let message = "No se pudo obtener tu ubicación";
        switch(error.code) {
            case error.PERMISSION_DENIED:
                message = "⚠️ Permiso de ubicación denegado";
                break;
            case error.POSITION_UNAVAILABLE:
                message = "⚠️ Información de ubicación no disponible";
                break;
            case error.TIMEOUT:
                message = "⚠️ Tiempo de espera agotado para obtener ubicación";
                break;
        }

        const toast = document.createElement('div');
        toast.className = 'fixed top-20 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-2xl z-50 toast flex items-center gap-2';
        toast.innerHTML = `<i class="fas fa-exclamation-circle text-yellow-400"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    },

    getLocationString() {
        if (this.city && this.country) {
            return `${this.city}, ${this.country}`;
        }
        if (this.position) {
            return `${this.position.latitude.toFixed(4)}, ${this.position.longitude.toFixed(4)}`;
        }
        return "Ubicación no disponible";
    }
};

// Initialize
